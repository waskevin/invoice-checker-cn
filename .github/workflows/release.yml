name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -m pytest -q

      - name: Build application
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Python python -Name InvoiceChecker-fixed

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          if (-not ($version -match '^\d+\.\d+\.\d+')) {
            $version = "0.0.0"
          }
          .\scripts\build-installer.ps1 -AppVersion $version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceChecker-Setup
          path: release/InvoiceChecker-Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/InvoiceChecker-Setup.exe
          generate_release_notes: true
